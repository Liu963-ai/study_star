<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FF8A3D">
<title>汉字小星球 · 朗读剧场</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/langdu.css">
</head>
<body class="page" style="--mc:var(--c-langdu)">

  <!-- 顶栏：返回 + 步骤点（第 3 点亮） -->
  <header class="learn-bar">
    <button class="back-btn pressable" data-say="回首页"><span class="ico" data-ico="back"></span></button>
    <div class="step-dots" aria-hidden="true">
      <span class="sdot"></span><span class="sdot"></span><span class="sdot on"></span><span class="sdot"></span><span class="sdot"></span>
    </div>
  </header>

  <!-- ===== 顶部状态条（§6.0 全局框架，头像位＝笑脸图标）===== -->
  <header class="topbar">
    <span class="avatar-smile ico" data-ico="smile" aria-hidden="true"></span>
    <button class="star-pill pressable">⭐ <b data-star-count>0</b></button>
    <span class="topbar-space"></span>
    <button class="icon-btn btn-volume pressable" aria-label="音量开关"></button>
  </header>

  <main class="ld-main">
    <!-- 左列：课文单句卡（卡拉OK逐字高亮）+ 控件 + 录音条 -->
    <section class="ld-left">
      <div class="ld-textnav">
        <button class="pill-sm pressable" id="btnPrevText" aria-label="上一篇">‹</button>
        <span id="textLabel"></span>
        <button class="pill-sm pressable" id="btnNextText" aria-label="下一篇">›</button>
      </div>
      <div class="poem-card card" id="poemCard" aria-label="点击播放整句"></div>

      <div class="ld-controls">
        <button class="pill pressable" id="btnNextLine"><span class="ico" data-ico="play"></span><span>下一句</span></button>
        <button class="pill pressable" id="btnSlow"><span class="ico" data-ico="speaker"></span><span>慢速</span></button>
        <button class="pill pressable" id="btnTap"><span class="ico" data-ico="mic"></span><span>点字发音</span></button>
        <button class="pill pressable" id="btnLoop"><span class="ico" data-ico="replay"></span><span>分句循环</span></button>
      </div>

      <!-- 录音条：话筒按钮 + 音量波纹 + 状态文字 -->
      <div class="rec-bar card">
        <button class="rec-mic pressable" id="btnMic" aria-label="按下说话">
          <span class="ico" data-ico="mic"></span>
        </button>
        <div class="rec-wave" id="recWave" aria-hidden="true"></div>
        <span class="rec-text">正在听你说…</span>
      </div>
    </section>

    <!-- 右列：课文插图卡（生图工具按课文场景生成）+ 自评卡 -->
    <aside class="ld-right">
      <div class="illus-card card" id="illusCard"></div>

      <div class="rate-card">
        <p class="rate-title">我读得怎么样？</p>
        <button class="rate-opt pressable" data-stars="3">
          <span class="rate-face">😀</span><span class="rate-name">读得很棒</span>
          <span class="rate-stars">⭐⭐⭐</span>
        </button>
        <button class="rate-opt pressable" data-stars="2">
          <span class="rate-face">🙂</span><span class="rate-name">还不错</span>
          <span class="rate-stars">⭐⭐<i>⭐</i></span>
        </button>
        <button class="rate-opt pressable" data-stars="0" id="rateAgain">
          <span class="rate-face">😴</span><span class="rate-name">再读一次</span>
          <span class="ico rate-re" data-ico="replay"></span>
        </button>
      </div>
    </aside>
  </main>

  <!-- ===== 底部导航：5 个 SVG 线性图标，无文字 ===== -->
  <footer class="navbar">
    <button class="nav-btn pressable" data-href="home.html" data-say="回首页"><span class="ico" data-ico="home"></span></button>
    <button class="nav-btn pressable" data-href="ditu.html" data-say="闯关地图"><span class="ico" data-ico="map"></span></button>
    <button class="nav-btn pressable is-current" data-say="继续探险"><span class="ico" data-ico="mic"></span></button>
    <button class="nav-btn pressable" data-href="jiangli.html" data-say="星星罐"><span class="ico" data-ico="jar"></span></button>
    <button class="nav-btn nav-lock pressable" data-href="parent.html"><span class="ico" data-ico="lock"></span></button>
  </footer>


<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/report.js"></script>
<script src="js/tts.js"></script>
<script src="js/audio-db.js"></script>
<script src="js/recorder.js"></script>
<script src="js/planner.js"></script>
<script src="assets/lib/pinyin-pro.min.js"></script>
<script src="js/langdu.js"></script>
</body>
</html>
